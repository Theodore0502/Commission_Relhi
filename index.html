          </div>
          <div class="vertical-col vertical-body-line dropped" data-vn="Thân hình hắn tựa núi non huyền thiết sừng sững, khung xương khắc sâu thần văn thôn phệ viễn cổ, sâu thẳm trong cơ thể ngưng tụ lõi thái dương chí thuần cuồng bạo.">
            其身躯如玄铁山岳，骨骼镌刻着上古吞噬神纹，体内深处凝铸着至纯至狂之太阳炽核。
          </div>
          <div class="vertical-col vertical-body-line dropped" data-vn="Thuở hồng hoang mới khai mở, mười vầng mặt trời thiêu đốt dữ dội trên vòm trời, vạn vật sinh linh chìm trong biển lửa cháy rụi ngàn dặm.">
            相传洪荒初开，天穹十日肆虐，万物生灵焦土千里。
          </div>
          <div class="vertical-col vertical-body-line dropped" data-vn="Thần Lang đạp rách hư không, há miệng nuốt trọn chín vầng thái dương rực lửa, khóa vĩnh viễn năng lượng cuồng bạo thiêu rụi chúng sinh vào huyết mạch và thần hồn.">
            神狼踏碎太虚长空，张口生吞九天炽烈神轮，硬生生将焚尽众生的暴虐太阳锁入狼骨血脉与神魂深处。
          </div>
          <div class="vertical-col vertical-body-line dropped" data-vn="Nơi ánh mắt hắn nhìn qua, nhật nguyệt lu mờ, cõi trần tịch mịch; khi tiếng gầm vang lên, ngàn sao run rẩy, chỉ còn lại cõi đêm vĩnh hằng và uy áp cuồng diễm vô biên.">
            无尽烈阳在其脏腑间化为苍茫狂焰，双眸凝视之处，炽日黯然，八荒失色；长啸骤起之时，群星战栗，唯留亘古长夜与滔天炎威。
